name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skill-lint:
    name: Validate SKILL.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repository checks (manifests, SKILL.md, revisions, assets, ports)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 tools/validate.py

      - name: Install checks, diagnostics, uninstall, and first-task demo
        run: cd tools && python3 -m unittest discover -v

      - name: Measured-layer tests
        run: |
          cd measured && python3 -m unittest -v test_measured
          python3 approve.py --self-check

  recipes:
    name: Acceptance-check recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: cd recipes && npm ci && npx playwright install --with-deps chromium
      - name: Run recipes against the fixture site
        run: cd recipes && npm test
