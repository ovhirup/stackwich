name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skill-lint:
    name: Validate SKILL.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifests valid and in agreement
        run: |
          test -f .claude-plugin/marketplace.json || { echo "::error::marketplace.json missing"; exit 1; }
          test -f plugins/stackwich/.claude-plugin/plugin.json || { echo "::error::plugin.json missing"; exit 1; }
          jq -e . .claude-plugin/marketplace.json > /dev/null || { echo "::error::marketplace.json is not valid JSON"; exit 1; }
          jq -e . plugins/stackwich/.claude-plugin/plugin.json > /dev/null || { echo "::error::plugin.json is not valid JSON"; exit 1; }
          [ "$(jq '.plugins | length' .claude-plugin/marketplace.json)" -eq 1 ] || { echo "::error::marketplace must list exactly one plugin"; exit 1; }
          [ "$(jq -r '.plugins[0].source' .claude-plugin/marketplace.json)" = "./plugins/stackwich" ] || { echo "::error::marketplace entry source must be ./plugins/stackwich"; exit 1; }
          [ "$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)" = "$(jq -r '.name' plugins/stackwich/.claude-plugin/plugin.json)" ] || { echo "::error::marketplace entry name and plugin.json name disagree"; exit 1; }
          PV="$(jq -r '.version' plugins/stackwich/.claude-plugin/plugin.json)"
          SV="$(sed -n 's/^[[:space:]]*version:[[:space:]]*//p' plugins/stackwich/skills/stackwich/SKILL.md | head -1)"
          [ "$PV" = "$SV" ] || { echo "::error::plugin.json version ($PV) != SKILL.md version ($SV)"; exit 1; }
          cmp -s LICENSE plugins/stackwich/LICENSE || { echo "::error::plugins/stackwich/LICENSE has drifted from the root LICENSE"; exit 1; }
          grep -q "^## $PV " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $PV' heading — a shipped version with no release note"; exit 1; }
          echo "manifests OK"

      - name: Plugin shape invariants
        run: |
          test ! -e SKILL.md || { echo "::error::a root SKILL.md reappeared — the canonical skill lives at plugins/stackwich/skills/stackwich/SKILL.md and must not be duplicated"; exit 1; }
          test ! -e assets || { echo "::error::a root assets/ reappeared — the scaffolding source lives inside the skill directory"; exit 1; }
          test ! -e plugins/stackwich/agents || { echo "::error::the plugin must NOT ship agents/ — plugin agents install namespaced (stackwich:advisor) and the policy block references bare names; the skill scaffolds them instead"; exit 1; }
          [ "$(ls plugins/stackwich/skills | wc -l)" -eq 1 ] || { echo "::error::plugins/stackwich/skills must contain exactly one skill directory"; exit 1; }
          echo "plugin shape OK"

      - name: Frontmatter and structure checks
        run: |
          S=plugins/stackwich/skills/stackwich/SKILL.md
          test -f "$S" || { echo "::error::$S missing"; exit 1; }
          head -1 "$S" | grep -qx -- '---' || { echo "::error::missing frontmatter opener"; exit 1; }
          grep -q '^name: stackwich' "$S" || { echo "::error::frontmatter name missing"; exit 1; }
          grep -q '^description:' "$S" || { echo "::error::frontmatter description missing"; exit 1; }
          grep -qE '^[[:space:]]*author:' "$S" || { echo "::error::frontmatter author missing"; exit 1; }
          [ "$(grep -cx -- '<!-- stackwich:v1 -->' "$S")" -eq 1 ] || { echo "::error::SKILL.md must contain exactly one whole-line opening marker"; exit 1; }
          [ "$(grep -cx -- '<!-- /stackwich:v1 -->' "$S")" -eq 1 ] || { echo "::error::SKILL.md must contain exactly one whole-line closing marker"; exit 1; }
          [ "$(grep -cx -- '<!-- policy-rev: 3 -->' "$S")" -eq 1 ] || { echo "::error::SKILL.md must contain exactly one whole-line policy-rev: 3 comment"; exit 1; }
          for h in Prompt Context Harness Loop Graph; do
            awk '/^<!-- stackwich:v1 -->$/,/^<!-- \/stackwich:v1 -->$/' "$S" | grep -q "^### $h" || { echo "::error::policy block missing the $h layer"; exit 1; }
          done
          echo "SKILL.md OK"

      - name: Frontmatter parses as YAML
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import sys, yaml, pathlib
          targets = {
            "plugins/stackwich/skills/stackwich/SKILL.md": "stackwich",
            "grok/SKILL.md": "stackwich-grok",
            "codex/SKILL.md": "stackwich-codex",
          }
          bad = False
          for path, expect in targets.items():
            text = pathlib.Path(path).read_text()
            if not text.startswith("---\n"):
              print(f"::error::{path} has no frontmatter block"); bad = True; continue
            block = text.split("---\n", 2)[1]
            try:
              fm = yaml.safe_load(block)
            except yaml.YAMLError as e:
              print(f"::error::{path} frontmatter is not valid YAML: {e}"); bad = True; continue
            if fm.get("name") != expect:
              print(f"::error::{path} name is {fm.get('name')!r}, expected {expect!r}"); bad = True
            desc = fm.get("description") or ""
            if not desc:
              print(f"::error::{path} has no description"); bad = True
            elif len(desc) > 1024:
              print(f"::error::{path} description is {len(desc)} chars, over the 1024 limit"); bad = True
            if not fm.get("author") and not (fm.get("metadata") or {}).get("author"):
              print(f"::error::{path} has no author — every distributed copy must name one"); bad = True
          sys.exit(1 if bad else 0)
          PY
          echo "frontmatter OK"

      - name: Agent assets present and well-formed
        run: |
          A=plugins/stackwich/skills/stackwich/assets
          for a in advisor executor verifier; do
            test -f "$A/$a.md" || { echo "::error::$A/$a.md missing"; exit 1; }
            grep -q "^name: $a" "$A/$a.md" || { echo "::error::$A/$a.md name wrong"; exit 1; }
            grep -q '^model:' "$A/$a.md" || { echo "::error::$A/$a.md model missing"; exit 1; }
            grep -q '^tools:' "$A/$a.md" || { echo "::error::$A/$a.md tools missing"; exit 1; }
          done
          echo "assets OK"

      - name: Grok port well-formed
        run: |
          test -f grok/SKILL.md || { echo "::error::grok/SKILL.md missing"; exit 1; }
          grep -qx -- 'name: stackwich-grok' grok/SKILL.md || { echo "::error::grok port name must be stackwich-grok"; exit 1; }
          [ "$(grep -cx -- '<!-- stackwich:v1 -->' grok/SKILL.md)" -eq 1 ] || { echo "::error::grok needs exactly one whole-line opening marker"; exit 1; }
          [ "$(grep -cx -- '<!-- /stackwich:v1 -->' grok/SKILL.md)" -eq 1 ] || { echo "::error::grok needs exactly one whole-line closing marker"; exit 1; }
          [ "$(grep -c '^```' grok/SKILL.md)" -eq 2 ] || { echo "::error::grok policy block fence unbalanced"; exit 1; }
          [ "$(grep -cxE -- '<!-- stackwich-grok-rev: [0-9]+ -->' grok/SKILL.md)" -eq 1 ] || { echo "::error::grok policy block needs exactly one whole-line rev comment"; exit 1; }
          for h in Prompt Context Harness Loop Graph; do
            awk '/^<!-- stackwich:v1 -->$/,/^<!-- \/stackwich:v1 -->$/' grok/SKILL.md | grep -q "^### $h" || { echo "::error::grok policy block missing the $h layer"; exit 1; }
          done
          echo "grok port OK"

      - name: Codex port well-formed
        run: |
          test -f codex/SKILL.md || { echo "::error::codex/SKILL.md missing"; exit 1; }
          grep -qx -- 'name: stackwich-codex' codex/SKILL.md || { echo "::error::codex port name must be stackwich-codex"; exit 1; }
          test -f codex/references/templates.md || { echo "::error::codex/references/templates.md missing — SKILL.md depends on it"; exit 1; }
          [ "$(grep -cx -- '<!-- stackwich-codex:v1 -->' codex/references/templates.md)" -eq 1 ] || { echo "::error::codex templates need exactly one whole-line opening marker"; exit 1; }
          [ "$(grep -cx -- '<!-- /stackwich-codex:v1 -->' codex/references/templates.md)" -eq 1 ] || { echo "::error::codex templates need exactly one whole-line closing marker"; exit 1; }
          [ "$(grep -cxE -- '<!-- stackwich-codex-rev: [0-9]+ -->' codex/references/templates.md)" -eq 1 ] || { echo "::error::codex policy block needs exactly one whole-line rev comment"; exit 1; }
          for h in Prompt Context Harness Loop Graph; do
            awk '/^<!-- stackwich-codex:v1 -->$/,/^<!-- \/stackwich-codex:v1 -->$/' codex/references/templates.md | grep -q "^### $h" || { echo "::error::codex policy block missing the $h layer"; exit 1; }
          done
          for a in advisor executor verifier; do
            grep -q "^## $a.toml" codex/references/templates.md || { echo "::error::templates missing $a.toml section"; exit 1; }
          done
          test -f codex/agents/openai.yaml || { echo "::error::codex/agents/openai.yaml missing"; exit 1; }
          test -f codex/LICENSE || { echo "::error::codex/LICENSE missing"; exit 1; }
          echo "codex port OK"

      - name: README hero image exists
        run: test -f docs/sandwich.jpg && echo "docs OK"
