name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skill-lint:
    name: Validate SKILL.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Frontmatter and structure checks
        run: |
          test -f SKILL.md || { echo "::error::SKILL.md missing"; exit 1; }
          head -1 SKILL.md | grep -qx -- '---' || { echo "::error::missing frontmatter opener"; exit 1; }
          grep -q '^name: stackwich' SKILL.md || { echo "::error::frontmatter name missing"; exit 1; }
          grep -q '^description:' SKILL.md || { echo "::error::frontmatter description missing"; exit 1; }
          grep -qE '^[[:space:]]*author:' SKILL.md || { echo "::error::frontmatter author missing"; exit 1; }
          grep -q 'stackwich:v1' SKILL.md || { echo "::error::install block markers missing"; exit 1; }
          grep -q '/stackwich:v1' SKILL.md || { echo "::error::install block close marker missing"; exit 1; }
          echo "SKILL.md OK"

      - name: Agent assets present and well-formed
        run: |
          for a in advisor executor verifier; do
            test -f "assets/$a.md" || { echo "::error::assets/$a.md missing"; exit 1; }
            grep -q "^name: $a" "assets/$a.md" || { echo "::error::assets/$a.md name wrong"; exit 1; }
            grep -q '^model:' "assets/$a.md" || { echo "::error::assets/$a.md model missing"; exit 1; }
            grep -q '^tools:' "assets/$a.md" || { echo "::error::assets/$a.md tools missing"; exit 1; }
          done
          echo "assets OK"

      - name: Grok port well-formed
        run: |
          test -f grok/SKILL.md || { echo "::error::grok/SKILL.md missing"; exit 1; }
          grep -qx -- 'name: stackwich-grok' grok/SKILL.md || { echo "::error::grok port name must be stackwich-grok"; exit 1; }
          grep -qx -- '<!-- stackwich:v1 -->' grok/SKILL.md || { echo "::error::grok open marker missing or not on its own line"; exit 1; }
          grep -qx -- '<!-- /stackwich:v1 -->' grok/SKILL.md || { echo "::error::grok close marker missing or not on its own line"; exit 1; }
          [ "$(grep -c '^```' grok/SKILL.md)" -eq 2 ] || { echo "::error::grok policy block fence unbalanced"; exit 1; }
          grep -q 'stackwich-grok-rev:' grok/SKILL.md || { echo "::error::grok rev comment missing from the policy block"; exit 1; }
          for h in Prompt Context Harness Loop Graph; do
            grep -q "^### $h" grok/SKILL.md || { echo "::error::grok policy block missing the $h layer"; exit 1; }
          done
          echo "grok port OK"

      - name: Codex port well-formed
        run: |
          test -f codex/SKILL.md || { echo "::error::codex/SKILL.md missing"; exit 1; }
          grep -qx -- 'name: stackwich-codex' codex/SKILL.md || { echo "::error::codex port name must be stackwich-codex"; exit 1; }
          grep -q 'stackwich-codex:v1' codex/SKILL.md || { echo "::error::codex open marker missing"; exit 1; }
          grep -q '/stackwich-codex:v1' codex/SKILL.md || { echo "::error::codex close marker missing"; exit 1; }
          test -f codex/references/templates.md || { echo "::error::codex/references/templates.md missing — SKILL.md depends on it"; exit 1; }
          grep -q 'stackwich-codex:v1' codex/references/templates.md || { echo "::error::templates policy block marker missing"; exit 1; }
          grep -q 'stackwich-codex-rev:' codex/references/templates.md || { echo "::error::codex rev comment missing from the policy block"; exit 1; }
          for h in Prompt Context Harness Loop Graph; do
            grep -q "^### $h" codex/references/templates.md || { echo "::error::codex policy block missing the $h layer"; exit 1; }
          done
          for a in advisor executor verifier; do
            grep -q "^## $a.toml" codex/references/templates.md || { echo "::error::templates missing $a.toml section"; exit 1; }
          done
          test -f codex/agents/openai.yaml || { echo "::error::codex/agents/openai.yaml missing"; exit 1; }
          test -f codex/LICENSE || { echo "::error::codex/LICENSE missing"; exit 1; }
          echo "codex port OK"

      - name: README hero image exists
        run: test -f docs/sandwich.jpg && echo "docs OK"
